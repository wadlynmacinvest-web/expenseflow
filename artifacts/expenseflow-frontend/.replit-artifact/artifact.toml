kind = "web"
previewPath = "/"
title = "ExpenseFlow"
version = "1.0.0"
id = "artifacts/expenseflow-frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25051

[services.development]
run = "pnpm --filter @workspace/expenseflow-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/expenseflow-frontend", "run", "build" ]
publicDir = "artifacts/expenseflow-frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25051"
BASE_PATH = "/"
